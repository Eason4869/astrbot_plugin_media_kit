name: CI

on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all python sources
        run: python -m compileall -q core main.py run_local.py tests

      - name: Validate config schema JSON
        run: python -c "import json,sys; json.load(open('_conf_schema.json', encoding='utf-8')); print('schema OK')"

      # 单元测试自举仓库根路径，兼容 unittest discover 任意启动方式。
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
